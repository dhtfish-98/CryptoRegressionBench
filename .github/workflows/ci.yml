name: Fixed AES-GCM library regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install fixed library and tool
        run: python -m pip install . -r requirements-exact.txt
      - name: Run real-library corpus and targeted tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Verify installed default corpus CLI
        run: |
          crypto-regression-bench --version
          crypto-regression-bench --help
          python -c 'from crypto_regression_bench import run_vectors; r=run_vectors(); assert r["counts"]["cases"] == 316 and r["execution_results"]["mismatched"] == 0 and r["execution_results"]["error"] == 0 and r["execution_results"]["skipped"] == 27 and r["status"] == "OPEN"'
